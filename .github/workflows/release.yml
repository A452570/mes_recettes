name: Publier une version

# Se lance quand tu crées un tag de version, par ex. v1.0
on:
  push:
    tags: ['v*', 'V*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Décoder la clé de signature
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/recettes.jks"

      - name: Compiler l'APK signé
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/recettes.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: recettes
        run: gradle assembleRelease

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk "recettes-${GITHUB_REF_NAME}.apk"

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: recettes-*.apk
          generate_release_notes: true
